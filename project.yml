# project.yml — XcodeGen specification for Habitium
#
# This repository does not commit the generated .xcodeproj (see .gitignore).
# Generate it locally with XcodeGen (https://github.com/yonaskolb/XcodeGen):
#
#   brew install xcodegen
#   cp Configuration/Secrets.example.xcconfig Configuration/Secrets.xcconfig
#   # edit Configuration/Secrets.xcconfig with your real API keys
#   xcodegen generate
#   open Habitium.xcodeproj
#
name: Habitium
options:
  bundleIdPrefix: com.habitium
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1" # iPhone only
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Configuration/Debug.xcconfig
  Release: Configuration/Release.xcconfig

packages:
  Supabase:
    url: https://github.com/supabase-community/supabase-swift
    from: "2.0.0"
    # Depends on the "Supabase" umbrella product (SupabaseClient) rather
    # than the bare Auth module — it's the officially documented pattern
    # and handles the auth endpoint URL/headers correctly. Only
    # client.auth is actually used (email/password sign-up + sign-in +
    # verification + password reset) — see SupabaseAuthManager. The
    # Postgres/Storage/Realtime pieces it also pulls in aren't used since
    # app data stays local, but they add no real weight until called.

targets:
  Habitium:
    type: application
    platform: iOS
    sources:
      - path: Habitium
      - path: Shared
      - path: SharedWatch
    resources:
      - path: Habitium/Resources/Assets.xcassets
    entitlements:
      path: Habitium/Habitium.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
        com.apple.developer.applesignin:
          - Default
    info:
      path: Habitium/Info.plist
      properties:
        CFBundleDisplayName: Habitium
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "Habitium usa la camara para fotografiar tus comidas y estimar sus calorias y macronutrientes."
        NSPhotoLibraryUsageDescription: "Habitium accede a tus fotos para analizar comidas guardadas en tu galeria."
        NSUserNotificationsUsageDescription: "Habitium envia recordatorios de tus tareas, eventos y registros de comidas."
        NSFaceIDUsageDescription: "Habitium usa Face ID para bloquear el acceso a tus datos personales."
        OPENAI_API_KEY: $(OPENAI_API_KEY)
        ANTHROPIC_API_KEY: $(ANTHROPIC_API_KEY)
        SUPABASE_URL_SCHEME: $(SUPABASE_URL_SCHEME)
        SUPABASE_URL_HOST: $(SUPABASE_URL_HOST)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        APP_GROUP_ID: $(APP_GROUP_ID)
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    dependencies:
      - target: HabitiumWidgetsExtension
        embed: true
      - target: HabitiumWatch
        embed: true
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.habitium.app
        INFOPLIST_FILE: Habitium/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    scheme:
      testTargets:
        - HabitiumTests
      commandLineArguments:
        "-com.apple.CoreData.ConcurrencyDebug 1": false

  HabitiumWidgetsExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: HabitiumWidgets
      - path: Shared
    resources:
      - path: HabitiumWidgets/Assets.xcassets
    entitlements:
      path: HabitiumWidgets/HabitiumWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    info:
      path: HabitiumWidgets/Info.plist
      properties:
        CFBundleDisplayName: Habitium Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        APP_GROUP_ID: $(APP_GROUP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.habitium.app.widgets
        INFOPLIST_FILE: HabitiumWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES

  HabitiumWatch:
    # Modern (watchOS 9+) single-target Watch App — no separate WatchKit
    # Extension target needed. Embedded into the iOS app above. NOTE: this
    # is the trickiest target type to get exactly right without a live
    # Xcode/compiler feedback loop — if `xcodegen generate` or Xcode
    # complains about it, the fallback is: delete this target from
    # project.yml, add a "Watch App" target by hand in Xcode (File > New >
    # Target > watchOS > App), then point its sources at HabitiumWatch/
    # and Shared/. See README for details.
    type: application
    platform: watchOS
    sources:
      - path: HabitiumWatch
      - path: Shared
      - path: SharedWatch
    resources:
      - path: HabitiumWatch/Assets.xcassets
    entitlements:
      path: HabitiumWatch/HabitiumWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: HabitiumWatch/Info.plist
      properties:
        CFBundleDisplayName: Habitium
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.habitium.app
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        APP_GROUP_ID: $(APP_GROUP_ID)
        NSHealthShareUsageDescription: "Habitium usa HealthKit para registrar tu sesión de entrenamiento mientras cuenta tus repeticiones."
        NSHealthUpdateUsageDescription: "Habitium guarda tus entrenamientos en Salud para que queden en tu historial de actividad."
        NSMotionUsageDescription: "Habitium usa el acelerómetro del Watch para contar tus repeticiones automáticamente."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.habitium.app.watchkitapp
        INFOPLIST_FILE: HabitiumWatch/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SDKROOT: watchos
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  HabitiumTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HabitiumTests
    dependencies:
      - target: Habitium
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.habitium.app.tests

schemes:
  Habitium:
    build:
      targets:
        Habitium: all
        HabitiumWidgetsExtension: all
        HabitiumWatch: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HabitiumTests
    archive:
      config: Release
