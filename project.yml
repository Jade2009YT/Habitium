# project.yml — XcodeGen specification for Habitium
#
# This repository does not commit the generated .xcodeproj (see .gitignore).
# Generate it locally with XcodeGen (https://github.com/yonaskolb/XcodeGen):
#
#   brew install xcodegen
#   cp Configuration/Secrets.example.xcconfig Configuration/Secrets.xcconfig
#   # edit Configuration/Secrets.xcconfig with your real API keys
#   xcodegen generate
#   open Habitium.xcodeproj
#
name: Habitium
options:
  bundleIdPrefix: com.habitium
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1" # iPhone only
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Configuration/Debug.xcconfig
  Release: Configuration/Release.xcconfig

packages: {}

targets:
  Habitium:
    type: application
    platform: iOS
    sources:
      - path: Habitium
      - path: Shared
    resources:
      - path: Habitium/Resources/Assets.xcassets
    entitlements:
      path: Habitium/Habitium.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    info:
      path: Habitium/Info.plist
      properties:
        CFBundleDisplayName: Habitium
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "Habitium usa la camara para fotografiar tus comidas y estimar sus calorias y macronutrientes."
        NSPhotoLibraryUsageDescription: "Habitium accede a tus fotos para analizar comidas guardadas en tu galeria."
        NSUserNotificationsUsageDescription: "Habitium envia recordatorios de tus tareas, eventos y registros de comidas."
        OPENAI_API_KEY: $(OPENAI_API_KEY)
        ANTHROPIC_API_KEY: $(ANTHROPIC_API_KEY)
        APP_GROUP_ID: $(APP_GROUP_ID)
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    dependencies:
      - target: HabitiumWidgetsExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.habitium.app
        INFOPLIST_FILE: Habitium/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    scheme:
      testTargets:
        - HabitiumTests
      commandLineArguments:
        "-com.apple.CoreData.ConcurrencyDebug 1": false

  HabitiumWidgetsExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: HabitiumWidgets
      - path: Shared
    resources:
      - path: HabitiumWidgets/Assets.xcassets
    entitlements:
      path: HabitiumWidgets/HabitiumWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    info:
      path: HabitiumWidgets/Info.plist
      properties:
        CFBundleDisplayName: Habitium Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        APP_GROUP_ID: $(APP_GROUP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.habitium.app.widgets
        INFOPLIST_FILE: HabitiumWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES

  HabitiumTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HabitiumTests
    dependencies:
      - target: Habitium
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.habitium.app.tests

schemes:
  Habitium:
    build:
      targets:
        Habitium: all
        HabitiumWidgetsExtension: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HabitiumTests
    archive:
      config: Release
