# Cabeceras de seguridad para servir Habitium desde el Synology.
#
# La Content-Security-Policy ya va dentro del HTML (etiqueta <meta>), así
# que la app está protegida aunque no pongas esto. Pero hay tres cosas
# que SOLO funcionan como cabecera HTTP y que conviene añadir:
#
#   · frame-ancestors — impide que otra web meta Habitium dentro de un
#     <iframe> invisible y te robe clics ("clickjacking"): ponen un botón
#     falso encima del tuyo y tú pulsas el suyo sin verlo.
#   · HSTS — obliga al navegador a usar siempre https con tu dominio, así
#     que nadie en la misma wifi puede degradar la conexión a http y leer
#     lo que pasa por ella. OJO: solo después de tener el certificado
#     funcionando, porque si lo pones antes te bloqueas a ti mismo.
#   · X-Content-Type-Options — impide que el navegador "adivine" el tipo
#     de un archivo y ejecute como script algo que no lo es.
#
# ── Cómo ponerlo en DSM ────────────────────────────────────────────
# Panel de control → Portal de inicio de sesión → Avanzado → Cabecera
# HTTP personalizada. Añade una entrada por cada línea de abajo.
#
# Si usas Web Station con nginx, el bloque está al final.

Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "DENY"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set Permissions-Policy "camera=(self), microphone=(), geolocation=(), interest-cohort=()"
Header always set Content-Security-Policy "frame-ancestors 'none'"

# Solo cuando https ya funcione. Un año, con subdominios.
# Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

# ── Equivalente para nginx ─────────────────────────────────────────
#
# add_header X-Content-Type-Options "nosniff" always;
# add_header X-Frame-Options "DENY" always;
# add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
# add_header Content-Security-Policy "frame-ancestors 'none'" always;
# # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
